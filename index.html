<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Love Heart</title>

<style>
    body {
        background: #050008;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
        margin: 0;
    }

    #heart {
        width: 600px;
        height: 600px;
        position: relative;
        animation: pulse 1.5s infinite ease-in-out;
    }

    .love {
        position: absolute;
        color: #f5a4d0;
        font-family: monospace;
        font-size: 15px;
        text-shadow: 0 0 8px #ff69b4,
                     0 0 15px #ff1493;
        white-space: nowrap;
    }

    @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
    }
</style>
</head>

<body>

<div id="heart"></div>

<script>
const heart = document.getElementById("heart");

for (let i = 0; i < 180; i++) {
    const t = (i / 180) * Math.PI * 2;

    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = -(13 * Math.cos(t)
        - 5 * Math.cos(2*t)
        - 2 * Math.cos(3*t)
        - Math.cos(4*t));

    const word = document.createElement("div");

    word.className = "love";
    word.textContent = "I love you ♥";

    word.style.left = `${300 + x * 10}px`;
    word.style.top = `${300 + y * 10}px`;

    word.style.transform = `translate(-50%, -50%) rotate(${t * 180 / Math.PI + 90}deg)`;

    heart.appendChild(word);
}
</script>

</body>
</html>
